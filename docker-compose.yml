
version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: pharmacie
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: A@077068
    ports:
      - "5433:5432"
    volumes:
      # - pgdata:/var/lib/postgresql/data
      - ./pharmacie_backup_2.sql:/docker-entrypoint-initdb.d/pharmacie_backup_2.sql:ro
    networks:
      - test-network

  pharmacie:
    build: ./pharmacie/demo
    container_name: pharmacie-backend-soap
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pharmacie
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: A@077068
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - test-network

  validation:
    build: ./validation/demo
    container_name: validation-backend-soap
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pharmacie
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: A@077068
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SERVER_PORT: 8081
      PHARMACIE_SOAP_URL: http://pharmacie:8080/ws
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - pharmacie
    networks:
      - test-network

  prescription:
    build: ./prescription-service
    container_name: prescription-backend
    environment:
      SERVER_PORT: 8082
      VALIDATION_SERVICE_URL: http://validation:8081/api/validate
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pharmacie
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: A@077068
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    ports:
      - "8082:8082"
    depends_on:
      - validation
      - pharmacie
    networks:
      - test-network
    
  front:
    build: ./front
    container_name: front-app
    environment:
      - VITE_API_URL=http://prescription-backend:8082/api/prescriptions
      - VITE_DRUGS_API_URL=http://validation-backend-soap:8081/api/drugs
    ports:
      - "3000:80"
    depends_on:
      - prescription
    networks:
      - test-network    

  

networks:
  test-network:
    driver: bridge

volumes:
  pgdata:
