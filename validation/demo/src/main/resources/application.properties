spring.application.name=demo
spring.docker.compose.enabled=false
server.port=8081
pharmacie.soap.url=http://localhost:8080/ws

#PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/pharmacie
spring.datasource.username=postgres
spring.datasource.password=A@077068
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.ws=DEBUG
logging.level.com.td1Rest=DEBUG  

# Pretty-print JSON in logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Show full stack traces
logging.level.root=INFO
